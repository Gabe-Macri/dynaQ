name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Verify & Publish Release
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Swift Unit Tests
        run: swift test --parallel

      - name: Run Rust SIMD Tests
        run: cargo test --manifest-path native/dynaq-rust/Cargo.toml

      - name: Run Python IPC Tests
        run: python3 -m unittest discover -s python/tests

      - name: Execute Production Release Packaging
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          NOTARY_KEYCHAIN_PROFILE: ${{ secrets.NOTARY_KEYCHAIN_PROFILE }}
        run: ./scripts/build_release.sh

      - name: Verify Release Checksums
        run: |
          cd output
          shasum -a 256 -c SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "dynaQ ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body_path: output/RELEASE_NOTES.txt
          files: |
            output/dynaQ-Installer.dmg
            output/dynaQ-Installer.pkg
            output/SHA256SUMS.txt

