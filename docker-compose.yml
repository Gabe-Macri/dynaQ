version: "3.8"

services:
  # Standalone DSP benchmark & telemetry CLI
  dynaq-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: dynaq:latest
    container_name: dynaq-cli
    command: ["--help"]

  # Static technical documentation server
  dynaq-docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: dynaq:latest
    container_name: dynaq-docs
    command: ["docs"]
    ports:
      - "8080:8080"
    restart: unless-stopped
